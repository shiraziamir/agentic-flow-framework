profile_version: 1
project_id: example-service
updated_at: 2026-09-14T00:00:00Z

project_mode:
  mode: PRODUCT_BUILD
  vibe_prototype:
    sacrificial_by_default: true
    production_baseline: false
    sensitive_or_production_data: DENIED
    promotion_requires_rebaseline: true
  product_build:
    require_product_brief: true
    require_quality_or_eval_contract: true
    require_architecture_discovery: true
    require_walking_skeleton: true
    require_architecture_checkpoint: true

task_focus_policy:
  require_single_primary_task: true
  require_active_task_role: true
  side_task_max_rounds_without_focus_review: 3
  side_task_may_redefine_primary_objective: false
  side_task_promotion: MANAGER_OR_OPERATOR_DECISION
  interrupt_requires_primary_checkpoint: true
  resume_primary_after_side_or_interrupt_by_default: true
  alert_on_side_task_attention_drift: true

swamp_guard:
  enabled: true
  check_at_material_checkpoints: true
  states: [CLEAR, WATCH, ALERT, STOP_REBASELINE]
  repeated_remediation_alert_after: 2
  require_eval_before_ai_rag_tuning: true
  require_vertical_slice_before_broad_feature_growth: true
  require_decision_for_major_architecture_change: true
  require_rebaseline_for_vibe_to_product: true
  stop_on_unresolved_sensitive_data_boundary: true
  stop_on_source_of_truth_ambiguity: true
  watch_on_side_task_attention_drift: true
  watch_on_repeated_system_lens_open_risk: true

dual_lens:
  enabled: true
  require_system_truth_map_for_product_build: true
  require_data_authority_map_when_stateful_or_cost_sensitive: true
  require_system_effect_matrix_for_material_tasks: true
  require_behavior_scenarios_for_material_business_logic: true
  require_mutation_or_path_proof_for_load_bearing_tests: true
  system_effect_states: [UNAFFECTED, VERIFIED, CHANGED_AND_TESTED, OPEN_RISK, NOT_APPLICABLE]
  cross_system_audit:
    enabled: true
    material_task_interval: 6
    recommended_interval_range: "5-8"
    before_demo_deployment: true
    before_real_customer_release: true
    after_material_incident: true
    before_or_after_material_authority_change: true

scale_boundaries:
  require_current_target: true
  require_expected_load_or_unknown: true
  require_known_ceiling_or_unknown: true
  require_hard_safety_limit_for_unbounded_resources: true
  require_failure_behavior: true
  require_scale_up_trigger: true

codebase_scale: MEDIUM
readiness_tier: STANDARD

quality:
  test_strategy: TEST_FIRST_FOR_MATERIAL_CLAIMS
  mutation_or_path_proof:
    required_for_load_bearing_tests: true
  minimum_layers:
    - UNIT
    - INTEGRATION
    - CONTRACT

execution_readiness:
  required_for_behavior_changes: true
  minimum_capability: EPHEMERAL_INTEGRATION
  real_application_runtime: REQUIRED_WHEN_AFFECTED
  real_database: REQUIRED_WHEN_AFFECTED
  real_migrations: REQUIRED_WHEN_AFFECTED
  real_external_boundary: CONTROLLED_SUBSTITUTE_ALLOWED
  mock_only_closure: DENIED_FOR_INTEGRATION_OR_STRONGER
  when_unavailable: BLOCK_AND_REQUEST_ENVIRONMENT

agent_mutation_policy:
  mode: STRICT_PREVIEW
  group_related_changes_into_batches: true
  require_current_vs_proposed_state: true
  require_planned_checks_before_apply: true
  require_rollback_for_material_changes: true
  remediation_windows:
    enabled: true
    default_max_iterations: 1
    maximum_without_escalation: 2
    extra_iteration_requires_new_material_finding: true
    manager_review_required_before_closure: true

workspace_safety:
  preserve_unknown_dirty_work: true
  destructive_git_requires_explicit_authority: true

external_effects:
  real_provider_calls: EXPLICIT_AUTHORITY_REQUIRED
  paid_api_calls: EXPLICIT_AUTHORITY_REQUIRED
  message_or_notification_sends: EXPLICIT_AUTHORITY_REQUIRED

review_policy:
  pre_manager_adversarial_review: REQUIRED_FOR_MEDIUM_HIGH
  consolidated_manager_findings: true
  independent_closure: REQUIRED_FOR_HIGH
  independence:
    implementation: REQUIRED_FOR_INDEPENDENT_CLOSURE
    context: REQUIRED_FOR_INDEPENDENT_CLOSURE
    authority: REQUIRED_FOR_MATERIAL_WORK
    evidence: REQUIRED_FOR_INDEPENDENT_CLOSURE
    model_diversity: PREFERRED
  multi_model_agreement_upgrades_evidence: false

role_access:
  project_architect:
    source: READ_ONLY
    product_mutation: DENIED
    production_mutation: DENIED
  designer:
    source: READ_ONLY
    production_read: DENIED
    production_mutation: DENIED
  executor:
    source: BOUNDED_WRITE
    production_read: OWNER_APPROVAL
    production_mutation: OWNER_APPROVAL
  manager:
    source: READ_REVIEW
    production_read: OWNER_APPROVAL
    production_mutation: DENIED
  independent_judge:
    source: READ_ONLY
    production_read: OWNER_APPROVAL
    production_mutation: DENIED

model_routing:
  vendor_neutral: true
  project_architect: HIGH_REASONING_WHEN_JUSTIFIED
  executor: TASK_ADEQUATE_COST_EFFICIENT
  manager: HIGH_REASONING_WHEN_JUSTIFIED
  independent_judge: HIGH_REASONING_SEPARATE_CONTEXT
  never_reduce_acceptance_or_evidence_for_cost: true

state_handoff:
  repository_transports_engineering_state: true
  human_transports_authority: true
  require_current_task_ref: true
  require_primary_task_ref: true
  require_active_task_role: true
  require_resume_checkpoint_for_interrupt: true
  require_current_repository_ref: true
  require_system_truth_map_ref_when_applicable: true
  require_system_lens_open_risks: true
  session_reset_after_durable_checkpoint: ALLOWED

flow_metrics:
  enabled: true
  collect_material_tasks_only: true

operations:
  metrics: REQUIRED
  logs: REQUIRED
  traces: OPTIONAL
  slo: OPTIONAL
  backup: REQUIRED
  restore_test: REQUIRED
  rollback: REQUIRED

security:
  threat_model: OPTIONAL
  dependency_review: REQUIRED
  secret_scanning: REQUIRED
  least_privilege: REQUIRED

usage_reporting:
  quota_snapshot: OPTIONAL
  report_after_material_task: true
  notify_operator: false
  stale_after_seconds: 900
  never_reduce_acceptance_quality: true

agent_environment_policy:
  local: AUTO_ALLOWED
  ephemeral_test: AUTO_ALLOWED
  shared_test: OWNER_APPROVAL
  staging: OWNER_APPROVAL
  production_read: OWNER_APPROVAL
  production_mutation: OWNER_APPROVAL

production_mode:
  enabled: false
  rollback_or_forward_recovery_required_for_every_mutation: true
  require_abort_condition: true
  require_post_change_verification: true
  irreversible_change:
    require_forward_recovery_plan: true
    require_backup_or_checkpoint: true
    require_blast_radius_control: true

architecture_policy:
  pattern_mode: AGENT_PROPOSES_OWNER_MAY_OVERRIDE
  require_rationale_for_new_abstraction: true
  avoid_pattern_without_boundary_or_failure_mode: true
  freeze_hard_to_change_invariants_not_easy_choices: true
  architecture_decisions:
    require_context_decision_consequences_revisit_trigger: true

temporary_overrides:
  directory: .agentic/overrides
  require_expiry: true
  require_owner: true
  require_reason: true
  require_compensating_control: true