name: Agent Bundle Release Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build portable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Record framework version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Framework version: $version"

      - name: Check release-document version freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          checks = {
              'ARCHITECTURE.md': f'**Version:** {version}',
              'README.md': f'**Framework version:** {version}',
              'agentic-flow-framework.en.md': f'**Reader-guide version:** {version}',
              'agentic-flow-framework.en.html': f'Agentic Flow Framework v{version}',
              'agentic-flow-framework.fa.html': f'Agentic Flow Framework v{version}',
              'CHANGELOG.md': f'## {version} ',
          }
          for path, needle in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'{path}: expected release marker {needle!r}')
          print(f'release freshness: PASS ({version})')
          PY

      - name: Compile deterministic Python helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/verification_lint.py \
            scripts/production_readiness_lint.py \
            scripts/usage_ledger.py \
            scripts/build_agent_bundle.py \
            scripts/test_verification_lint.py \
            scripts/test_production_readiness_lint.py \
            scripts/test_build_agent_bundle.py

      - name: Run verification-lint self-tests
        run: python3 scripts/test_verification_lint.py

      - name: Run production-readiness self-tests
        run: python3 scripts/test_production_readiness_lint.py

      - name: Run bundle-builder self-test
        run: python3 scripts/test_build_agent_bundle.py

      - name: Build bundle from full checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 scripts/build_agent_bundle.py --output dist/agentic-flow-agent-bundle.zip

      - name: Verify bundle manifest, hashes, and boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          bundle = Path('dist/agentic-flow-agent-bundle.zip')
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          required = {
              'agentic-flow/START_HERE.md',
              'agentic-flow/INSTALL_PROMPT.txt',
              'agentic-flow/BUNDLE_MANIFEST.json',
              'agentic-flow/VERSION',
              'agentic-flow/ARCHITECTURE.md',
              'agentic-flow/docs/agent/START_HERE.md',
              'agentic-flow/docs/agent/MIDSTREAM_ADOPTION.md',
          }
          forbidden_fragments = (
              '/docs/operator/',
              '/docs/references/',
              '/docs/architecture/',
              '/research/',
              '/retrospectives/',
              '/stories/',
          )

          with zipfile.ZipFile(bundle) as zf:
              names = set(zf.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'bundle missing required files: {missing}')

              forbidden = sorted(
                  name for name in names
                  if any(fragment in name for fragment in forbidden_fragments)
              )
              if forbidden:
                  raise SystemExit(f'bundle contains forbidden context files: {forbidden[:20]}')

              manifest = json.loads(zf.read('agentic-flow/BUNDLE_MANIFEST.json'))
              if manifest.get('framework_version') != version:
                  raise SystemExit(
                      f"manifest version {manifest.get('framework_version')!r} != VERSION {version!r}"
                  )
              if manifest.get('entrypoint') != 'START_HERE.md':
                  raise SystemExit('manifest entrypoint must be START_HERE.md')

              for item in manifest.get('files', []):
                  rel = item['path']
                  bundled_name = f'agentic-flow/{rel}'
                  if bundled_name not in names:
                      raise SystemExit(f'manifest file missing from zip: {rel}')
                  data = zf.read(bundled_name)
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != item['sha256']:
                      raise SystemExit(f'hash mismatch for {rel}')
                  if len(data) != item['bytes']:
                      raise SystemExit(f'byte-count mismatch for {rel}')

              if zf.read('agentic-flow/START_HERE.md') != zf.read('agentic-flow/docs/agent/START_HERE.md'):
                  raise SystemExit('root START_HERE.md does not match docs/agent/START_HERE.md')

              Path('dist/BUNDLE_MANIFEST.json').write_bytes(
                  zf.read('agentic-flow/BUNDLE_MANIFEST.json')
              )

          print('full-checkout bundle verification: PASS')
          PY

      - name: Generate SHA-256 receipt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum agentic-flow-agent-bundle.zip > agentic-flow-agent-bundle.zip.sha256
          cat agentic-flow-agent-bundle.zip.sha256

      - name: Publish workflow summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Agent Bundle release receipt"
            echo
            echo "- Framework version: \`${{ steps.version.outputs.version }}\`"
            echo "- Repository ref: \`${GITHUB_SHA}\`"
            echo "- Verification-lint self-tests: PASS"
            echo "- Production-readiness self-tests: PASS"
            echo "- Bundle-builder self-test: PASS"
            echo "- Full-checkout bundle manifest/hash/boundary verification: PASS"
            echo
            echo '```text'
            cat dist/agentic-flow-agent-bundle.zip.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release-check artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-flow-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/agentic-flow-agent-bundle.zip
            dist/agentic-flow-agent-bundle.zip.sha256
            dist/BUNDLE_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record uploaded artifact
        shell: bash
        run: |
          {
            echo
            echo "- Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`"
            echo "- Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`"
            echo "- Artifact URL: ${{ steps.upload.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
