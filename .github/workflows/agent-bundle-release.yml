name: Agent Bundle Release Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check release markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          checks = {
              'ARCHITECTURE.md': f'**Version:** {version}',
              'README.md': f'**Framework version:** {version}',
              'CHANGELOG.md': f'## {version} ',
          }
          for path, needle in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'{path}: expected {needle!r}')
          print(f'release freshness: PASS ({version})')
          PY

      - name: Compile Python helpers
        run: python3 -m py_compile scripts/*.py

      - name: Run verification-lint self-tests
        run: python3 scripts/test_verification_lint.py

      - name: Run production-readiness self-tests
        run: python3 scripts/test_production_readiness_lint.py

      - name: Run Claude usage-snapshot self-tests
        run: python3 scripts/test_claude_usage_snapshot.py

      - name: Run newcomer-documentation self-tests
        run: python3 scripts/test_docs_onboarding.py

      - name: Run Dual-Lens and productization self-tests
        run: python3 scripts/test_dual_lens_docs.py

      - name: Run bundle-builder self-test
        run: python3 scripts/test_build_agent_bundle.py

      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 scripts/build_agent_bundle.py --output dist/agentic-flow-agent-bundle.zip

      - name: Verify bundle manifest and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          bundle = Path('dist/agentic-flow-agent-bundle.zip')
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          required = {
              'agentic-flow/README.md',
              'agentic-flow/START_HERE.md',
              'agentic-flow/INSTALL_PROMPT.txt',
              'agentic-flow/BEST_PRACTICES_USED.en.txt',
              'agentic-flow/PRIMARY_SOURCES.md',
              'agentic-flow/BUNDLE_MANIFEST.json',
              'agentic-flow/VERSION',
              'agentic-flow/ARCHITECTURE.md',
              'agentic-flow/docs/GETTING_STARTED.md',
              'agentic-flow/docs/GUIDE.fa.md',
              'agentic-flow/docs/agent/START_HERE.md',
              'agentic-flow/docs/agent/TASK_WORKFLOW_DRAFT_REVIEW_APPLY_VERIFY.md',
              'agentic-flow/schemas/MUTATION_APPROVAL_POLICY.md',
              'agentic-flow/schemas/TASK_CONTRACT.md',
              'agentic-flow/schemas/PROJECT_PROFILE_CONFIG.md',
              'agentic-flow/schemas/SYSTEM_TRUTH_MAP.md',
              'agentic-flow/templates/SYSTEM_TRUTH_MAP.example.yaml',
          }
          forbidden = ('/research/', '/retrospectives/', '/stories/')
          with zipfile.ZipFile(bundle) as zf:
              names = set(zf.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'bundle missing: {missing}')
              bad = [n for n in names if any(f in n for f in forbidden)]
              if bad:
                  raise SystemExit(f'bundle contains cold history: {bad[:20]}')
              if any(n.endswith('.html') for n in names):
                  raise SystemExit('bundle contains reader HTML')
              manifest = json.loads(zf.read('agentic-flow/BUNDLE_MANIFEST.json'))
              if manifest.get('framework_version') != version:
                  raise SystemExit('manifest VERSION mismatch')
              for item in manifest.get('files', []):
                  name = f"agentic-flow/{item['path']}"
                  data = zf.read(name)
                  if hashlib.sha256(data).hexdigest() != item['sha256']:
                      raise SystemExit(f'hash mismatch: {name}')
              aliases = {
                  'agentic-flow/START_HERE.md': 'agentic-flow/docs/agent/START_HERE.md',
                  'agentic-flow/README.md': 'agentic-flow/bundle/README.md',
                  'agentic-flow/BEST_PRACTICES_USED.en.txt': 'agentic-flow/bundle/BEST_PRACTICES_USED.en.txt',
                  'agentic-flow/PRIMARY_SOURCES.md': 'agentic-flow/docs/references/PRIMARY_SOURCES.md',
              }
              for alias, source in aliases.items():
                  if zf.read(alias) != zf.read(source):
                      raise SystemExit(f'alias mismatch: {alias}')
              Path('dist/BUNDLE_MANIFEST.json').write_bytes(zf.read('agentic-flow/BUNDLE_MANIFEST.json'))
          print('bundle verification: PASS')
          PY

      - name: Generate SHA-256 receipt
        shell: bash
        run: |
          cd dist
          sha256sum agentic-flow-agent-bundle.zip > agentic-flow-agent-bundle.zip.sha256

      - name: Upload release-check artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-flow-${{ github.sha }}
          path: |
            dist/agentic-flow-agent-bundle.zip
            dist/agentic-flow-agent-bundle.zip.sha256
            dist/BUNDLE_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
